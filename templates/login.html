{% extends "base.html" %}

{% block title %}Login Admin – Prediksi Harga Cabai Bali{% endblock %}

{% block content %}
<div style="display:flex; justify-content:center; align-items:center; min-height: calc(100vh - 100px);">
    <div class="kartu" style="width: 100%; max-width: 360px; padding: 32px 28px;">
        <div style="text-align:center; margin-bottom: 24px;">
            <div style="font-size: 32px; margin-bottom: 8px;">🌶</div>
            <div style="font-size: 17px; font-weight: 700; color: #1a1a1a;">Login Admin</div>
            <div style="font-size: 12px; color: #999; margin-top: 4px;">Akses terbatas untuk pengelola sistem</div>
        </div>

        <form method="POST" action="/login">
            <div style="margin-bottom: 14px;">
                <label style="display:block; font-size:12.5px; color:#666; margin-bottom:5px; font-weight:600;">
                    Username
                </label>
                <input
                    type="text"
                    name="username"
                    id="input-username"
                    placeholder="Masukkan username"
                    required
                    style="width:100%; border:1px solid #ddd; border-radius:6px; padding:8px 11px;
                           font-size:13.5px; font-family:inherit; outline:none; color:#222;"
                >
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display:block; font-size:12.5px; color:#666; margin-bottom:5px; font-weight:600;">
                    Password
                </label>
                <input
                    type="password"
                    name="password"
                    id="input-password"
                    placeholder="Masukkan password"
                    required
                    style="width:100%; border:1px solid #ddd; border-radius:6px; padding:8px 11px;
                           font-size:13.5px; font-family:inherit; outline:none; color:#222;"
                >
            </div>
            <button
                type="submit"
                id="btn-submit-login"
                style="width:100%; background:#c0392b; color:#fff; border:none; border-radius:6px;
                       padding:9px; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer;"
            >
                Masuk
            </button>
        </form>

        <div style="text-align:center; margin-top: 18px;">
            <a href="/" style="font-size:12.5px; color:#999; text-decoration:none;">← Kembali ke Beranda</a>
        </div>
    </div>
</div>
{% endblock %}
