<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sistem Prediksi Cabai</title>
    <!-- Tambahkan library Chart.js untuk grafik -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Dashboard Prediksi Harga Cabai Rawit</h1>
    <button id="btn-prediksi">Hitung Prediksi 7 Hari Ke Depan</button>
    
    <div style="width: 600px; height: 400px;">
        <canvas id="grafikHarga"></canvas>
    </div>

    <script>
        const ctx = document.getElementById('grafikHarga').getContext('2d');
        let chart;

        document.getElementById('btn-prediksi').addEventListener('click', function() {
            // Mengambil data dari backend Flask tanpa reload halaman
            fetch('/api/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pemicu: 'klik_user' })
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    // Gambar grafik dengan data dari Flask
                    if(chart) chart.destroy(); // Hapus grafik lama jika ada
                    
                    chart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: ['Hari 1', 'Hari 2', 'Hari 3', 'Hari 4', 'Hari 5', 'Hari 6', 'Hari 7'],
                            datasets: [{
                                label: 'Estimasi Harga (Rp)',
                                data: data.prediksi_7_hari,
                                borderColor: 'red',
                                tension: 0.1
                            }]
                        }
                    });
                }
            });
        });
    </script>
</body>
</html>
